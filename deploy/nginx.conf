server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The game is one HTML file: never cache it, so players always get the latest version
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # Installed app (PWA): the service worker must never be cached, or updates would get stuck
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
    }
    location / {
        try_files $uri /index.html;
    }
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml application/manifest+json;
}
